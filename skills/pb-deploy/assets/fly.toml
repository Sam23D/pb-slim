# fly.toml — one always-on Machine with a volume. Per app: change `app` and `primary_region`.
# Builds the starter Dockerfile (pinned PocketBase, sha256-checked).
app = "pb-app"
primary_region = "dfw"

[build]

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # sleeping breaks sign-in and Live screens
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
